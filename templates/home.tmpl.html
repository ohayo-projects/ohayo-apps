<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#08070d">
<link rel="canonical" href="https://apps.ohayo.by{{SELF_PATH}}">
<link rel="alternate" hreflang="en" href="https://apps.ohayo.by/">
<link rel="alternate" hreflang="ru" href="https://apps.ohayo.by/ru">
<link rel="alternate" hreflang="x-default" href="https://apps.ohayo.by/">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ohayo">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://apps.ohayo.by{{SELF_PATH}}">
<meta property="og:image" content="https://apps.ohayo.by/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/head.js"></script>
</head>
<body>

<a class="skip" href="#main">{{SKIP}}</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand wordmark" href="{{SELF_PATH}}">Ohayo</a>
    <nav class="nav-links" aria-label="{{NAV_LABEL}}">
      <a class="nav-item" href="https://legal.ohayo.by/">{{NAV_LEGAL}}</a>
      <span class="lang">
        <a href="/" data-lang="en" {{EN_CURRENT}}>EN</a>
        <a href="/ru" data-lang="ru" {{RU_CURRENT}}>RU</a>
      </span>
    </nav>
  </div>
</header>

<main id="main">
  <section class="hero" style="padding-bottom:clamp(32px,5vw,56px)">
    <div class="wrap">
      <h1 style="max-width:16ch">{{H1}}</h1>
      <p class="lead">{{SUB}}</p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="hub-grid">
        <a class="app-card reveal" href="{{NETWORK_PATH}}">
          <span class="head">
            <img src="/assets/ohayo-network/icon.svg" alt="" width="60" height="60">
            <span>
              <h3>Ohayo Network</h3>
              <span class="meta">{{CARD_META}}</span>
            </span>
          </span>
          <p>{{CARD_TEXT}}</p>
          <span class="more">{{CARD_MORE}}</span>
        </a>
        <div class="soon reveal"><p style="margin:0">{{SOON}}</p></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <a class="brand wordmark" href="{{SELF_PATH}}">Ohayo</a>
        <p style="margin:12px 0 0">{{FOOTER_TAG}}</p>
      </div>
      <nav aria-label="{{FOOTER_NAV_LABEL}}">
        <a href="{{NETWORK_PATH}}">Ohayo Network</a>
        <a href="https://legal.ohayo.by/">{{FOOTER_LEGAL}}</a>
        <a href="mailto:feedback@ohayo.by">feedback@ohayo.by</a>
      </nav>
    </div>
    <p class="fine">© 2026 Ohayo Studio. {{FOOTER_TM}}</p>
  </div>
</footer>

<script src="/assets/site.js" defer></script>
</body>
</html>
